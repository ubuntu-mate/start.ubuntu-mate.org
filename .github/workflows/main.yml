name: CI

on: [push, pull_request]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Install i18n dependencies
      run: |
        sudo apt-get update
        sudo apt-get install translate-toolkit

    - name: Build website
      run: |
        scripts/build.sh

    - name: Publish to Cloudflare Pages
      if: ${{ github.event_name == 'push' && github.repository == 'ubuntu-mate/start.ubuntu-mate.org' && github.ref == 'refs/heads/master' }}
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: e6fe5e31e8183c8192347f15af553766
        command: pages deploy _site --project-name=start-ubuntu-mate-org --branch=master
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
